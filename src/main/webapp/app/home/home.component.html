<div class="portal">
  <div class="portal-grain" aria-hidden="true"></div>

  <div class="top-bar">
    <div ngbDropdown class="lang-dropdown" *ngIf="languages && languages.length > 1">
      <button ngbDropdownToggle class="icon-btn" id="lang-toggle" [title]="'global.menu.language' | translate">
        <fa-icon icon="globe"></fa-icon>
      </button>
      <ul ngbDropdownMenu aria-labelledby="lang-toggle" class="dropdown-menu-end">
        <li *ngFor="let language of languages">
          <a class="dropdown-item" href="javascript:void(0);" (click)="changeLanguage(language)">
            {{ language | findLanguageFromKey }}
          </a>
        </li>
      </ul>
    </div>

    <button *ngIf="account" class="icon-btn" (click)="logout()" [title]="'global.menu.account.logout' | translate">
      <fa-icon icon="sign-out-alt"></fa-icon>
    </button>

    <button *ngIf="!account" class="icon-btn" (click)="login()" [title]="'global.menu.account.login' | translate">
      <fa-icon icon="sign-in-alt"></fa-icon>
    </button>
  </div>

  <div [ngSwitch]="account !== null">
    <main class="workspace" *ngSwitchCase="true">
      <header class="workspace-header">
        <span class="eyebrow" jhiTranslate="home.eyebrow">Espace de travail</span>
        <h1 class="workspace-title">
          <span jhiTranslate="{{ greetingKey }}">Bonjour</span>, <span class="workspace-name">{{ fullName }}</span>
        </h1>
        <p class="workspace-subtitle" jhiTranslate="home.subtitle">Retrouvez vos applications ci-dessous</p>

        <div class="search-bar" *ngIf="applications.length > 3">
          <fa-icon icon="search"></fa-icon>
          <input type="text" [placeholder]="'home.search' | translate" [value]="searchTerm" (input)="onSearch($any($event.target).value)" />
        </div>
      </header>

      <section class="apps-grid" *ngIf="filteredApplications.length > 0">
        <button
          type="button"
          class="app-card"
          *ngFor="let app of filteredApplications; let i = index; trackBy: trackApp"
          [style.--i]="i"
          [style.--accent]="app.couleur || '#1F2B4D'"
          (click)="openApplication(app)"
        >
          <span class="app-card-accent"></span>
          <span class="app-card-logo">
            <img *ngIf="app.icon" [src]="'data:' + app.iconContentType + ';base64,' + app.icon" [alt]="app.nom" />
            <fa-icon *ngIf="!app.icon" icon="th-large"></fa-icon>
          </span>
          <span class="app-card-name">{{ app.nom }}</span>
          <span class="app-card-desc">{{ app.description }}</span>
          <span class="app-card-open" jhiTranslate="home.open">Ouvrir <fa-icon icon="arrow-right"></fa-icon></span>
        </button>
      </section>

      <div class="empty-state" *ngIf="filteredApplications.length === 0 && !isLoading">
        <fa-icon icon="folder-open"></fa-icon>
        <p jhiTranslate="home.noApplication">Aucune application disponible pour le moment.</p>
      </div>
    </main>

    <main class="gate" *ngSwitchCase="false">
      <div class="gate-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="eyebrow" jhiTranslate="home.eyebrow">Espace de travail</span>
      <h1 class="gate-title" jhiTranslate="home.title">Bienvenue dans le Portail</h1>
      <p class="gate-subtitle" jhiTranslate="home.subtitle">Retrouvez vos applications ci-dessous</p>
      <button class="gate-btn" (click)="login()" jhiTranslate="global.messages.info.authenticated.link">Se connecter</button>
    </main>
  </div>

  <div ngbDropdown dropdownClass="dropup" class="entities-fab" *ngIf="account">
    <button ngbDropdownToggle class="fab-btn" id="entities-toggle" [title]="'global.menu.entities.main' | translate">
      <fa-icon icon="th-list"></fa-icon>
    </button>
    <ul ngbDropdownMenu aria-labelledby="entities-toggle">
      <li>
        <a class="dropdown-item" routerLink="application-category">
          <fa-icon icon="asterisk" [fixedWidth]="true"></fa-icon>
          <span jhiTranslate="global.menu.entities.applicationCategory">Application Category</span>
        </a>
      </li>
      <li>
        <a class="dropdown-item" routerLink="application">
          <fa-icon icon="asterisk" [fixedWidth]="true"></fa-icon>
          <span jhiTranslate="global.menu.entities.application">Application</span>
        </a>
      </li>
    </ul>
  </div>
</div>
