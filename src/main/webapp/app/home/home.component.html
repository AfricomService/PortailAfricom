<div class="portal-wrapper">
  <!-- Barre d'icônes en haut à droite -->
  <div class="top-bar">
    <div ngbDropdown class="lang-dropdown" *ngIf="languages && languages.length > 1">
      <button ngbDropdownToggle class="icon-btn" id="lang-toggle" [title]="'global.menu.language' | translate">
        <fa-icon icon="globe"></fa-icon>
      </button>
      <ul ngbDropdownMenu aria-labelledby="lang-toggle" class="dropdown-menu-end">
        <li *ngFor="let language of languages">
          <a class="dropdown-item" href="javascript:void(0);" (click)="changeLanguage(language)">
            {{ language | findLanguageFromKey }}
          </a>
        </li>
      </ul>
    </div>

    <button *ngIf="account" class="icon-btn" (click)="logout()" [title]="'global.menu.account.logout' | translate">
      <fa-icon icon="sign-out-alt"></fa-icon>
    </button>

    <button *ngIf="!account" class="icon-btn" (click)="login()" [title]="'global.menu.account.login' | translate">
      <fa-icon icon="sign-in-alt"></fa-icon>
    </button>
  </div>

  <!-- Contenu principal -->
  <div class="portal-content">
    <div [ngSwitch]="account !== null">
      <!-- Utilisateur connecté -->
      <div class="welcome-section" *ngSwitchCase="true">
        <h1 class="welcome-title">
          <span jhiTranslate="home.title">Bienvenue</span>, <span class="welcome-name">{{ fullName }}</span>
        </h1>
        <p class="welcome-subtitle" jhiTranslate="home.subtitle">Ceci est votre page d'accueil</p>

        <div class="apps-grid" *ngIf="applications.length > 0">
          <div class="app-card" *ngFor="let app of applications; trackBy: trackApp" (click)="openApplication(app)">
            <div class="app-card-logo">
              <img *ngIf="app.icon" [src]="'data:' + app.iconContentType + ';base64,' + app.icon" [alt]="app.nom" />
              <fa-icon *ngIf="!app.icon" icon="th-large" class="default-icon"></fa-icon>
            </div>
            <div class="app-card-body">
              <h3 class="app-card-title">{{ app.nom }}</h3>
              <p class="app-card-description">{{ app.description }}</p>
            </div>
          </div>
        </div>

        <div class="empty-state" *ngIf="applications.length === 0 && !isLoading">
          <fa-icon icon="folder-open" size="2x"></fa-icon>
          <p jhiTranslate="home.noApplication">Aucune application disponible pour le moment.</p>
        </div>
      </div>

      <!-- Utilisateur non connecté -->
      <div class="login-section" *ngSwitchCase="false">
        <div class="login-card">
          <span class="hipster"></span>
          <h1 class="display-4" jhiTranslate="home.title">Bienvenue, Java Hipster !</h1>
          <p class="lead" jhiTranslate="home.subtitle">Ceci est votre page d'accueil</p>
          <button class="btn btn-primary btn-lg mt-3" (click)="login()" jhiTranslate="global.messages.info.authenticated.link">
            Se connecter
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bouton flottant Entités (bas droite) -->
  <div ngbDropdown dropdownClass="dropup" class="entities-fab" *ngIf="account">
    <button ngbDropdownToggle class="fab-btn" id="entities-toggle" [title]="'global.menu.entities.main' | translate">
      <fa-icon icon="th-list"></fa-icon>
    </button>
    <ul ngbDropdownMenu aria-labelledby="entities-toggle">
      <li>
        <a class="dropdown-item" routerLink="application-category">
          <fa-icon icon="asterisk" [fixedWidth]="true"></fa-icon>
          <span jhiTranslate="global.menu.entities.applicationCategory">Application Category</span>
        </a>
      </li>
      <li>
        <a class="dropdown-item" routerLink="application">
          <fa-icon icon="asterisk" [fixedWidth]="true"></fa-icon>
          <span jhiTranslate="global.menu.entities.application">Application</span>
        </a>
      </li>
    </ul>
  </div>
</div>
