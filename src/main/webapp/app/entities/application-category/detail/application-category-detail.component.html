<div class="row justify-content-center">
  <div class="col-8">
    <div *ngIf="applicationCategory">
      <h2 data-cy="applicationCategoryDetailsHeading">
        <span jhiTranslate="portailApp.applicationCategory.detail.title">Application Category</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ applicationCategory.id }}</span>
        </dd>
        <dt><span jhiTranslate="portailApp.applicationCategory.code">Code</span></dt>
        <dd>
          <span>{{ applicationCategory.code }}</span>
        </dd>
        <dt><span jhiTranslate="portailApp.applicationCategory.nom">Nom</span></dt>
        <dd>
          <span>{{ applicationCategory.nom }}</span>
        </dd>
        <dt><span jhiTranslate="portailApp.applicationCategory.description">Description</span></dt>
        <dd>
          <span>{{ applicationCategory.description }}</span>
        </dd>
        <dt><span jhiTranslate="portailApp.applicationCategory.ordreAffichage">Ordre Affichage</span></dt>
        <dd>
          <span>{{ applicationCategory.ordreAffichage }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/application-category', applicationCategory.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
