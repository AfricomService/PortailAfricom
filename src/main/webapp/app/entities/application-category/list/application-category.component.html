<div>
  <h2 id="page-heading" data-cy="ApplicationCategoryHeading">
    <span jhiTranslate="portailApp.applicationCategory.home.title">Application Categories</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info mr-2" (click)="loadAll()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="portailApp.applicationCategory.home.refreshListLabel">Refresh List</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-application-category"
        [routerLink]="['/application-category/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="portailApp.applicationCategory.home.createLabel"> Create a new Application Category </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <div class="alert alert-warning" id="no-result" *ngIf="applicationCategories?.length === 0">
    <span jhiTranslate="portailApp.applicationCategory.home.notFound">No applicationCategories found</span>
  </div>

  <div class="table-responsive" id="entities" *ngIf="applicationCategories && applicationCategories.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr>
          <th scope="col"><span jhiTranslate="global.field.id">ID</span></th>
          <th scope="col"><span jhiTranslate="portailApp.applicationCategory.code">Code</span></th>
          <th scope="col"><span jhiTranslate="portailApp.applicationCategory.nom">Nom</span></th>
          <th scope="col"><span jhiTranslate="portailApp.applicationCategory.description">Description</span></th>
          <th scope="col"><span jhiTranslate="portailApp.applicationCategory.ordreAffichage">Ordre Affichage</span></th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let applicationCategory of applicationCategories; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/application-category', applicationCategory.id, 'view']">{{ applicationCategory.id }}</a>
          </td>
          <td>{{ applicationCategory.code }}</td>
          <td>{{ applicationCategory.nom }}</td>
          <td>{{ applicationCategory.description }}</td>
          <td>{{ applicationCategory.ordreAffichage }}</td>
          <td class="text-right">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/application-category', applicationCategory.id, 'view']"
                class="btn btn-info btn-sm"
                data-cy="entityDetailsButton"
              >
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
              </button>

              <button
                type="submit"
                [routerLink]="['/application-category', applicationCategory.id, 'edit']"
                class="btn btn-primary btn-sm"
                data-cy="entityEditButton"
              >
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
              </button>

              <button type="submit" (click)="delete(applicationCategory)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
